name: headless
services:
  headless:
    container_name: headless
    image: dgadams/sdrconnect
    restart: unless-stopped
    init: true
    ports:
      - 5454:5454
    devices:
      - /dev/bus/usb:/dev/bus/usb

    user: sdruser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
   
    command: 
      - "/sdr/SDRconnect_headless"
      - "--websocket_port=5454"

#   state of health docker healthcheck
    healthcheck:
      test: echo -n | nc localhost 5454
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
