name: headless
services:
  headless:
    container_name: headless
    image: dgadams/sdrconnect
    restart: unless-stopped
    ports:
      - 5454:5454
    devices:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
   
    command: 
      - "/sdr/SDRconnect_headless"
      - "--websocket_port=5454"
