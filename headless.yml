name: sdrconnect-headless
services:
  sdrconnect-headless:
    container_name: sdrconnect-headless
    image: dgadams/sdrconnect
    restart: unless-stopped
    init: true
    network_mode: host
    devices:
      - /dev/bus/usb
    command: 
      - "/sdr/SDRconnect_headless"
      - "--websocket_port=5454"

    healthcheck:
      test: ["CMD", "pidof", "/sdr/SDRconnect_headless"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
