name: sdrconnect
services:
  rsp-dx:
    container_name: rsp-dx
    image: dgadams/sdrconnect
    restart: unless-stopped
    devices:
      - /dev/bus/usb
    ports:
      - 50000:50000
    command:
      - "/sdr/SDRconnect"
      - "--server"
      - "--port=50000"
      - "--centerfrequency=95500000"
      - "--antenna=1"
      - "--hwser=2103083B44"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: timeout 2 nc host.docker.internal 50000 || [ $$? -eq 143 ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
